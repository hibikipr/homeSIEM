# Reference rsyslog config for forwarding a natively-installed Homebridge
# instance's journald-logged output to homeSIEM's siem-ingest. See
# homebridge-pi-logs.md in this directory for the full setup walkthrough.
#
# Deploy on the Homebridge Pi itself (a separate host from siem-ingest),
# not on the SIEM host - this is the remote-forwarder side. Mirrors
# stacks/homelab-siem/log-forwarder/60-siem-docker-forward.conf in the
# infra repo (the bridge used on the SIEM host's own Docker containers),
# but filters on the systemd unit instead of Docker's CONTAINER_NAME field,
# since Homebridge runs via hb-service, not in a container - and forwards
# to a real LAN target instead of 127.0.0.1, since this is a different host.
#
# Replace SIEM_INGEST_HOST below with siem-ingest's LAN IP before use.
module(load="imjournal"
       StateFile="/var/spool/rsyslog/imjournal.state"
       PersistStateInterval="100"
       IgnorePreviousMessages="on"
       Ratelimit.Interval="0")

## startswith (not ==) also catches child-bridge instances, which hb-service
## runs as separate "homebridge@<name>" units when child bridges are enabled.
if $!_SYSTEMD_UNIT startswith "homebridge" then {
    action(
        type="omfwd"
        target="SIEM_INGEST_HOST"
        port="601"
        protocol="tcp"
        template="RSYSLOG_SyslogProtocol23Format"
        action.resumeRetryCount="-1"
        queue.type="linkedList"
        queue.size="10000"
    )
    stop
}
