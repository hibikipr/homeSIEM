# $${MY_DOCKER_DATA_DIR}/homesiem/vector/vector.toml
#
# One source + transform pair per device family; the sink and label set
# are shared. The job label is what keeps this feed distinct from the
# alloy and unpoller feeds already in the same Loki tenant.

[api]
enabled = true
address = "0.0.0.0:8686"

# ---------------------------------------------------------------- sources

[sources.unifi]
type = "syslog"
address = "0.0.0.0:514"
mode = "udp"
receive_buffer_bytes = 8388608   # needs net.core.rmem_max raised on the host

[sources.hosts_tcp]
type = "syslog"
address = "0.0.0.0:601"
mode = "tcp"

[sources.hosts_tls]
type = "syslog"
address = "0.0.0.0:6514"
mode = "tcp"
[sources.hosts_tls.tls]
enabled = true
crt_file = "/etc/vector/tls/server.crt"
key_file = "/etc/vector/tls/server.key"
## verify_certificate on a Vector *source* controls CLIENT-certificate
## verification, i.e. mutual TLS - not "verify our own cert". Confirmed
## empirically against timberio/vector:0.49.0-alpine during the final review:
## with `= true` and no ca_file, port 6514 rejects every connection. A client
## offering no certificate gets TLS alert 40 (handshake_failure); a client
## offering a self-signed certificate gets alert 48 (unknown_ca), because
## Vector falls back to the container's system root store, which will never
## contain a private homelab cert. The port was therefore 100% unusable as
## originally configured.
##
## `false` gives ordinary one-way TLS: the connection is encrypted and the
## SENDER verifies Vector's certificate - which is exactly what the design
## and docs/tls-setup.md describe ("trust this specific self-signed cert on
## the sending host"). Verified working end-to-end at this setting: a plain
## `openssl s_client` with no client cert completes the handshake, and the
## line lands in Loki with transport="tls/6514" and produces a heartbeat.
##
## To opt into REAL mutual TLS later, set this back to `true` AND add
## `ca_file = "/etc/vector/tls/ca.crt"` pointing at a private CA, then issue
## each sending host a client certificate from that CA. See docs/tls-setup.md.
verify_certificate = false

# ------------------------------------------------------------- transforms

[transforms.parse_unifi]
type = "remap"
inputs = ["unifi"]
source = '''
  .job = "siem"
  .source = "udm-ultra"
  .transport = "udp/514"
  .parser = "unifi-os"

  ## UniFi OS's "SIEM Server" integration (Settings → System Logging / SIEM) sends
  ## CEF-formatted messages with no <PRI> header, wrapped behind an arbitrary leading
  ## envelope token (observed: "CGU ", also "pandora " in vendor docs) that isn't a
  ## stable/parseable hostname. Splitting on the literal "CEF:0|" (rather than assuming
  ## the message starts with it) discards that leading token regardless of its content.
  ##
  ## Real captured counter-example: when the envelope's leading token is a real,
  ## RFC3164-shaped "<hostname> <tag>:" (e.g. "Townsville-CGU CEF:0|..."), Vector's
  ## OWN syslog source decoder already parses "Townsville-CGU" as .host and "CEF"
  ## (colon-terminated) as .appname BEFORE this transform ever runs - consuming
  ## "Townsville-CGU CEF:" out of .message entirely. The literal "CEF:0|" substring
  ## the check above looks for no longer exists in that case; .message starts
  ## directly at the CEF version marker ("0|Ubiquiti|..."). Detect this via the
  ## side effect Vector's decoder leaves behind (.appname == "CEF") combined with
  ## the message still being CEF-shaped, so a message that merely starts with a
  ## number for unrelated reasons doesn't false-positive.
  message_str = string!(.message)
  cef_tag_stripped_by_decoder = .appname == "CEF" && match(message_str, r'^0\|Ubiquiti\|')

  if contains(message_str, "CEF:0|") || cef_tag_stripped_by_decoder {
    .parser = "unifi-cef"
    cef_body = if contains(message_str, "CEF:0|") {
      split(message_str, "CEF:0|")[1]
    } else {
      ## The "0|" CEF-version marker is still present (only the "CEF:" tag text
      ## itself was consumed by Vector's decoder) - drop exactly those 2 chars
      ## so cef_body has the same "vendor|product|..." shape as the branch above.
      slice!(message_str, 2)
    }
    ## split!(): cef_body's static type is "string or null" (array indexing can't be
    ## proven non-null at compile time), even though contains() above guarantees a
    ## match exists at runtime. The bang assertion is required here, not optional.
    fields = split!(cef_body, "|")
    if length(fields) >= 7 {
      .cef_vendor = fields[0]
      .cef_product = fields[1]
      .cef_version = fields[2]
      .cef_signature_id = fields[3]
      .cef_name = fields[4]
      .appname = fields[4]
      .program = fields[4]
      ## to_int() is genuinely fallible (non-numeric input), so ?? is correct here —
      ## unlike the plain-field-access cases below, where ?? is rejected by the compiler
      ## as "unnecessary error coalescing" since field access on a map can't fail.
      cef_severity = to_int(fields[5]) ?? 0
      .severity = if cef_severity >= 9 { "crit" } else if cef_severity >= 7 { "err" } else if cef_severity >= 4 { "warning" } else { "info" }
      extension = join(slice!(fields, 6), "|") ?? ""
      ## This vendor's CEF extension values aren't space-escaped per spec - observed on
      ## real devices: UNIFIdeviceName=Townsville CGU, UNIFIvpnName=Townsville CGU,
      ## suser=Victor Galloza's Mobile Phone. field_delimiter: " " alone truncates every
      ## such value at its first space and leaves the rest ("CGU", "Mobile", "Phone", ...)
      ## as bogus keyless tokens - which is why .host below came through as just
      ## "Townsville" instead of "Townsville CGU". Re-delimit on a sentinel inserted only
      ## right before a recognized "KEY=" boundary, not on every space, so multi-word
      ## values stay intact; "msg=" is always the last field, so its free-text body never
      ## needs to be split further.
      ## "$$" (not "$"): Vector's config loader does its own env-interpolation pass over
      ## the whole TOML file, including comments, before VRL ever sees any of it - so a
      ## literal capture-group reference has to be double-escaped here or the loader
      ## aborts looking for an env var named "kv" (same reason the file header escapes
      ## the directory placeholder in its own comment above).
      delimited_extension = replace(extension, r' (?P<kv>[A-Za-z][A-Za-z0-9]*=)', "|||$${kv}")
      ext, err = parse_key_value(delimited_extension, key_value_delimiter: "=", field_delimiter: "|||")
      if err == null {
        .src_ip = ext.src
        .dst_ip = ext.dst
        dpt = ext.dpt
        .dst_port = to_int(dpt) ?? null
        proto = ext.proto
        ## downcase!() (bang): parse_key_value's values are typed as
        ## "string, boolean, null or array", not guaranteed string, even inside this
        ## is_null-guarded branch — the compiler still requires the assertion.
        .proto = if is_null(proto) { "" } else { downcase!(proto) }
        .unifi_device_mac = ext.UNIFIdeviceMac
        .unifi_device_ip = ext.UNIFIdeviceIp
        ## UNIFIhost has been observed as a useless literal "Host" placeholder on a
        ## real device, while UNIFIdeviceName held the actual device name in the same
        ## message — prefer UNIFIdeviceName, fall back to UNIFIhost only if absent.
        device_name = if !is_null(ext.UNIFIdeviceName) { ext.UNIFIdeviceName } else { ext.UNIFIhost }
        if !is_null(device_name) {
          .host = device_name
          .hostname = device_name
        }
      }
    }
  } else if match(string!(.message), r'\[(?P<rule>[A-Z_]+-\w+-[ADR])\]') {
    .rule     = parse_regex!(.message, r'\[(?P<rule>[A-Z_]+-\w+-[ADR])\]').rule
    .src_ip   = parse_regex(.message, r'(?:^| )SRC=(?P<val>[^ ]+)').val ?? null
    .dst_ip   = parse_regex(.message, r'(?:^| )DST=(?P<val>[^ ]+)').val ?? null
    dpt       = parse_regex(.message, r'(?:^| )DPT=(?P<val>[^ ]+)').val ?? null
    .dst_port = to_int(dpt) ?? null
    proto     = parse_regex(.message, r'(?:^| )PROTO=(?P<val>[^ ]+)').val ?? ""
    .proto    = downcase(proto)
    .action   = if ends_with(.rule, "-D") { "drop" } else { "accept" }
  }
'''

## Step 3 finding: Vector's syslog source populates `.source_type` with the
## *component type* ("syslog"), not the component id — confirmed empirically
## against this harness: both the hosts_tcp-sourced event and the
## unifi-sourced event carry `"source_type":"syslog"`, so `.source_type`
## cannot distinguish hosts_tcp from hosts_tls (both are also type="syslog").
## Using the brief's documented fallback instead: split into two
## branch transforms that each set only the transport-specific field, then
## feed a shared downstream transform for the common host-parsing logic.

[transforms.parse_hosts_tcp]
type = "remap"
inputs = ["hosts_tcp"]
source = '''
  .transport = "tcp/601"
'''

[transforms.parse_hosts_tls]
type = "remap"
inputs = ["hosts_tls"]
source = '''
  .transport = "tls/6514"
'''

[transforms.parse_hosts]
type = "remap"
inputs = ["parse_hosts_tcp", "parse_hosts_tls"]
source = '''
  .job = "siem"
  .source = downcase(string!(.host))
  .parser = "rfc5424"
'''

# ---------------------------------------------------------- enrichment

[transforms.enrich_geo]
type = "remap"
inputs = ["parse_unifi", "parse_hosts"]
source = '''
  ## Found against a real UniFi device: its "SIEM Server" integration's
  ## test event didn't carry a standard syslog PRI header, so Vector's
  ## syslog source never populated .severity - and sinks.loki's severity
  ## label template unconditionally requires it, so Loki 400'd and the
  ## whole event was silently dropped (not just the label). Any event
  ## missing severity for any reason (malformed sender, non-standard
  ## client) must not be dropped outright - default it instead.
  if is_null(.severity) {
    .severity = "info"
  }

  ## Found in production: a real Loki container's own logs, forwarded to this
  ## SIEM via syslog, arrived with severity="err" — taken from the RFC5424
  ## PRI header, which is all Vector's syslog source ever populates .severity
  ## from — even though the message itself is a self-reported "level=info"
  ## logfmt line. Whatever forwards these logs tags every line with a fixed
  ## PRI severity regardless of the emitting service's real level, and this
  ## isn't Loki-specific: any logfmt-emitting service forwarded the same way
  ## could hit it. A message's own self-reported level is more trustworthy
  ## than an externally-imposed, possibly-static PRI, so prefer it when
  ## present and recognized. Scoped to .parser == "rfc5424" (set by
  ## parse_hosts) so CEF-derived severity, computed differently, is
  ## untouched; non-bang parse_regex + is_string guard so an unparseable or
  ## missing level= leaves the PRI-derived severity as the fallback rather
  ## than aborting this remap.
  if .parser == "rfc5424" && is_string(.message) {
    reported_level = parse_regex(.message, r'(?:^| )level=(?P<val>\w+)').val ?? null
    if is_string(reported_level) {
      mapped_severity = if reported_level == "debug" { "debug" } else if reported_level == "info" { "info" } else if reported_level == "warn" || reported_level == "warning" { "warning" } else if reported_level == "error" || reported_level == "err" { "err" } else if reported_level == "fatal" || reported_level == "crit" || reported_level == "critical" { "crit" } else { null }
      if is_string(mapped_severity) {
        .severity = mapped_severity
      }
    }
  }

  ## Defensive clamp: found against a real UniFi device whose "SIEM
  ## Server" test event (a malformed, CEF-wrapped, non-PRI message - see
  ## the README's known-gaps entry on this integration) confused Vector's
  ## syslog timestamp decoder into producing a value 4 hours in the
  ## future. Confirmed empirically this is specific to malformed input:
  ## a well-formed RFC5424 message with an explicit `Z` UTC timestamp
  ## parses correctly even with the exact same TZ env var set on the
  ## process, so this isn't a blanket TZ-handling bug - just don't trust
  ## a source that hands back an implausible future timestamp, since
  ## Loki rejects anything too far ahead of real time and drops the
  ## entire event, not just the bad timestamp.
  if to_unix_timestamp(timestamp!(.timestamp)) > to_unix_timestamp(now()) + 300 {
    .timestamp = now()
  }

  ## is_string() (not exists()): exists() returns true for a field explicitly
  ## set to null, which the CEF branch above does whenever a message has no
  ## src= key - exists(.src_ip) && ip_cidr_contains!(...) would then call
  ## ip_cidr_contains! with null and abort this entire remap (reverting the
  ## severity-default and timestamp-clamp fixes above too), silently
  ## re-dropping events the clamp exists to save. The non-bang
  ## ip_cidr_contains() with `?? false` similarly protects against a
  ## malformed non-IP src string (attacker-reachable over unauthenticated
  ## UDP/514) aborting the same way.
  if is_string(.src_ip) && !(ip_cidr_contains("10.0.0.0/8", .src_ip) ?? false) {
    .geoip = get_enrichment_table_record("geolite", { "ip": .src_ip }) ?? {}
    .threat_intel = get_enrichment_table_record("threatlist", { "ip": .src_ip }).tag ?? null
  }
'''

## Bug found and fixed here (same direct-testing process as Task 3's
## parse_key_value finding): the naive fast_path condition
## `exists(.threat_intel)` is always true for every enriched event once
## enrich_geo runs, because enrich_geo assigns `.threat_intel` (even to
## literal `null` via `?? null`) for every event with a public src_ip.
## `exists()` checks key *presence*, not whether the value is non-null, so
## that condition would forward every enriched event to siem-api instead of
## just real threat-intel hits. Fixed with `!is_null(.threat_intel)`, which
## correctly distinguishes "key present with a real tag" from "key present
## but null."
[transforms.fast_path]
type = "filter"
inputs = ["enrich_geo"]
condition = '''
  !is_null(.threat_intel) || (.action == "drop" && !is_null(.dst_port))
'''

## Defaults to the real production filename, so deploying this file as-is
## needs no edit - just provision the database per docs/geoip-setup.md. The
## local test harness overrides GEOIP_MMDB_PATH to point at MaxMind's
## test-only database, which has a different filename. Note that if the file
## is missing Vector does NOT fail with "file not found": it silently drops
## the enrichment table, and enrich_geo then fails to compile with
## `invalid enum variant for argument "table" ... received: "geolite"`, so a
## missing mmdb takes the whole topology down. Provision it before deploying.
[enrichment_tables.geolite]
type = "geoip"
path = "${GEOIP_MMDB_PATH:-/geoip/GeoLite2-City.mmdb}"

[enrichment_tables.threatlist]
type = "file"
[enrichment_tables.threatlist.file]
path = "/geoip/threatlist.csv"
encoding = { type = "csv" }
[enrichment_tables.threatlist.schema]
ip = "string"
tag = "string"

# ---------------------------------------------------------- heartbeat

[transforms.heartbeat_throttle]
type = "throttle"
inputs = ["enrich_geo"]
threshold = 1
window_secs = 900
key_field = "{{ source }}"

[transforms.heartbeat_shape]
type = "remap"
inputs = ["heartbeat_throttle"]
source = '''
  . = {
    "name": .source,
    "address": .source_ip,
    "transport": .transport,
    "parser": .parser
  }
'''

# ------------------------------------------------------------------ sinks

## Bug found and fixed here during Task 5's real-siem-api end-to-end check
## (Step 4): the http sink's default framing for `encoding.codec = "json"`
## wraps every request body in a JSON array (`[{...}]`), even for a single
## buffered event. siem-api's real handlers (`handleFastpath`,
## `handleSourceHeartbeat`) `json.Decode` the body into a single struct, not
## a slice, so an array-wrapped body fails with 400 "invalid json body" —
## confirmed directly: identical curl payloads returned 400 for
## `[{...}]` and 202 for `{...}`. This was invisible against the stub
## receiver (Task 2-4's harness), which just logs whatever JSON it parses
## regardless of shape, so it never caught the mismatch. `framing.method =
## "newline_delimited"` makes each event its own request body, unwrapped.
## Applies to both http sinks below (`siem_api`, the pre-existing fast_path
## sink from Task 4, and `siem_heartbeat`, new in this task) since both
## send single-object bodies to handlers with the same decode shape.
[sinks.siem_api]
type = "http"
inputs = ["fast_path"]
uri = "${SIEM_API_URL}/ingest/fastpath"
method = "post"
encoding.codec = "json"
framing.method = "newline_delimited"
[sinks.siem_api.request.headers]
X-Fastpath-Token = "${SIEM_FASTPATH_TOKEN}"
[sinks.siem_api.buffer]
type = "memory"
max_events = 1000
when_full = "drop_newest"

[sinks.siem_heartbeat]
type = "http"
inputs = ["heartbeat_shape"]
uri = "${SIEM_API_URL}/sources/heartbeat"
method = "post"
encoding.codec = "json"
framing.method = "newline_delimited"
[sinks.siem_heartbeat.request.headers]
X-Fastpath-Token = "${SIEM_FASTPATH_TOKEN}"

[sinks.loki]
type = "loki"
inputs = ["enrich_geo"]
endpoint = "${LOKI_ENDPOINT}"
out_of_order_action = "accept"

[sinks.loki.encoding]
codec = "json"

[sinks.loki.labels]
job = "siem"
source = "{{ source }}"
host = "{{ host }}"
program = "{{ appname }}"
severity = "{{ severity }}"

[sinks.loki.buffer]
type = "disk"
max_size = 536870912
