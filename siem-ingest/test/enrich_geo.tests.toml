[[tests]]
name = "CEF event with no src= reaches enrich_geo without the transform erroring"

  [tests.input]
  insert_at = "parse_unifi"
  type = "log"

    [tests.input.log_fields]
    message = "CGU CEF:0|Ubiquiti|UniFi OS|5.1.19|1000|Admin Accessed UniFi OS|1|UNIFIhost=Office-UDM-Pro"

  [[tests.outputs]]
  extract_from = "enrich_geo"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
      ## This asserts the event survives to enrich_geo's output at all (a
      ## dropped/errored event yields zero output events and fails the test
      ## outright) and that severity/host - set upstream by parse_unifi -
      ## are untouched. It does NOT, by itself, prove enrich_geo's own
      ## src_ip guard avoided a runtime error: VRL's default remap error
      ## behavior reverts to the transform's *input* on error rather than
      ## dropping the event, and severity/host are already set by
      ## parse_unifi (upstream of enrich_geo), so they read the same either
      ## way. The guard fix itself (is_string(.src_ip) instead of
      ## exists(.src_ip), non-bang ip_cidr_contains with a ?? false
      ## fallback) was verified directly against the real Vector binary:
      ## the unfixed guard logs
      ## `error="function call error for \"ip_cidr_contains\" ... expected
      ## string, got null"` for this exact message; the fixed guard logs
      ## nothing.
      assert_eq!(.severity, "info")
      assert_eq!(.host, "Office-UDM-Pro")
    '''

[[tests]]
name = "CEF event with a garbage non-IP src reaches enrich_geo without the transform erroring"

  [tests.input]
  insert_at = "parse_unifi"
  type = "log"

    [tests.input.log_fields]
    message = "CGU CEF:0|Ubiquiti|UniFi OS|5.1.19|1000|Admin Accessed UniFi OS|1|src=not-an-ip UNIFIhost=Office-UDM-Pro"

  [[tests.outputs]]
  extract_from = "enrich_geo"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
      ## Same caveat as the test above. The garbage-src case is the
      ## attacker-reachable variant (unauthenticated UDP/514): the unfixed
      ## guard's bang ip_cidr_contains!() logs
      ## `error="... unable to parse IP address: invalid IP address
      ## syntax"` for this exact message; verified directly against the
      ## real Vector binary that the fixed guard does not.
      assert_eq!(.severity, "info")
      assert_eq!(.host, "Office-UDM-Pro")
    '''

[[tests]]
name = "CEF event with a valid public src still gets geoip enrichment (regression check)"

  [tests.input]
  insert_at = "parse_unifi"
  type = "log"

    [tests.input.log_fields]
    message = "CGU CEF:0|Ubiquiti|UniFi OS|5.1.19|1000|Admin Accessed UniFi OS|7|proto=TCP src=81.181.129.172 spt=54321 dst=192.168.0.233 dpt=443 UNIFIhost=Host UNIFIdeviceName=Townsville UNIFIdeviceMac=84:78:48:80:0d:86 UNIFIdeviceIp=192.168.0.1"

  [[tests.outputs]]
  extract_from = "enrich_geo"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
      assert_eq!(.severity, "err")
      assert!(exists(.geoip), "a valid public src_ip must still reach the geoip lookup after the guard fix")
    '''

[[tests]]
name = "syslog event's self-reported level= overrides a mismatched RFC5424 PRI severity"

  [tests.input]
  insert_at = "parse_hosts"
  type = "log"

    [tests.input.log_fields]
    host = "raspberrypi"
    severity = "err"
    parser = "rfc5424"
    message = 'level=info ts=2026-08-09T13:42:30.626767313Z caller=table_manager.go:195 index-store=tsdb-2020-10-24 msg="get or create table" found=true table=index_20674 wait_for_lock=12.686µs'

  [[tests.outputs]]
  extract_from = "enrich_geo"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
      ## Found in production: a real Loki container's own logs, forwarded via
      ## syslog, arrived with severity="err" (from the RFC5424 PRI header
      ## Vector's syslog source decodes) even though the message itself is a
      ## self-reported "level=info" line. Some forwarders tag every line with
      ## a fixed PRI severity regardless of the emitting service's real level
      ## - the message's own self-reported level is more trustworthy.
      assert_eq!(.severity, "info")
    '''

[[tests]]
name = "syslog event's severity is untouched when the message has no level= key"

  [tests.input]
  insert_at = "parse_hosts"
  type = "log"

    [tests.input.log_fields]
    host = "raspberrypi"
    severity = "err"
    parser = "rfc5424"
    message = "authentication failure for user admin from 10.0.0.5"

  [[tests.outputs]]
  extract_from = "enrich_geo"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
      assert_eq!(.severity, "err")
    '''

[[tests]]
name = "Go stdlib-logged INFO line overrides a stderr-derived RFC5424 PRI severity"

  [tests.input]
  insert_at = "parse_hosts"
  type = "log"

    [tests.input.log_fields]
    host = "raspberrypi"
    severity = "err"
    parser = "rfc5424"
    message = "2026/08/09 14:08:42 INFO Server stats (messages_cached=143, messages_published=17796, subscribers=1, topics_active=7)"

  [[tests.outputs]]
  extract_from = "enrich_geo"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
      ## Found in production: ntfy writes ALL of its output - including
      ## routine per-minute "Server stats" heartbeats, not just real errors
      ## - to stderr, so Docker's journald driver tags every line with
      ## PRIORITY=3/err regardless of the message's own level. Same
      ## PRI-vs-self-reported mismatch as the level= case above, just in
      ## Go's standard library logger format instead of logfmt.
      assert_eq!(.severity, "info")
    '''

[[tests]]
name = "a Go stdlib-timestamped message without an immediate level word is left untouched"

  [tests.input]
  insert_at = "parse_hosts"
  type = "log"

    [tests.input.log_fields]
    host = "raspberrypi"
    severity = "err"
    parser = "rfc5424"
    message = "2026/08/09 14:08:42 backup completed with 0 errors"

  [[tests.outputs]]
  extract_from = "enrich_geo"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
      ## Proves the Go-stdlib match is anchored immediately after the
      ## date/time prefix, not a bare word search anywhere in the message -
      ## "errors" here (lowercase, and not in level-word position) must not
      ## flip a PRI-derived severity that happens to already be "err".
      assert_eq!(.severity, "err")
    '''

[[tests]]
name = "netfilter event with a valid public src still gets geoip enrichment (pre-existing path, unaffected)"

  [tests.input]
  insert_at = "parse_unifi"
  type = "log"

    [tests.input.log_fields]
    message = "[WAN_LOCAL-DEFAULT-D]IN=eth0 OUT= SRC=203.0.113.9 DST=192.168.1.1 PROTO=TCP DPT=22"

  [[tests.outputs]]
  extract_from = "enrich_geo"

    [[tests.outputs.conditions]]
    type = "vrl"
    source = '''
      assert_eq!(.action, "drop")
      assert!(exists(.geoip), "the pre-existing netfilter path must still reach the geoip lookup after the guard fix")
    '''
